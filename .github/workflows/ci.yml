name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use only the standard library: no torch, transformers, or model downloads.
      - run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Smoke-test the CLIs
        run: |
          python -m trialx.evaluate --help > /dev/null
          python -m trialx.report --help > /dev/null
          bash -n scripts/run_benchmarks.sh
          bash -n scripts/quantize.sh
